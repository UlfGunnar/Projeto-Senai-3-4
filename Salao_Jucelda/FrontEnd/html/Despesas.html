<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Despesas</title>
</head>
<body>
    <header>
		<h1>Sistema de Gestão do Salão</h1>
		<nav aria-label="Navegação principal">
			<ul>
				<li><a href="home.html">Home</a></li>
				<li><a href="cadastro.html">Cadastro</a></li>
				<li><a href="listagem.html">Listagem de Agendamentos</a></li>
				<li><a href="agendamento.html">Criar Agendamento</a></li>
				<li><a href="../../dashboard_jucelda/dist/index_dash.html">Dashboard</a></li>
                <li><a href="Despesas.html">Cadastrar Despesa</a></li>
			</ul>
		</nav>
	</header>
    <main>
        <h2>Cadastro de Despesa</h2>
        <form action="" method="post">
            <div>
                <label for="itipo_despesa">Tipo de Despesa: </label>
                <select name="tipo_despesa" id="itipo_despesa">
                    <option value="DF">Despesa fixa</option>
                    <option value="DR">Despesa regular</option>
                    <option value="DP">Despesa parcelada</option>
                </select>
            </div>

            <div>
                <label for="ivalor_despesa">Valor Despesa: R$</label>
                <input type="number" name="valor_despesa" id="ivalor_despesa" min="0.01" step="0.01" required>
            </div>

            <div>
                <label for="idata_criacao">Data da Despesa: </label>
                <input type="date" name="data_criacao" id="idata_criacao" required>
            </div>

            <div>
                <h3>Produto:</h3>

                <div>
                    <label for="inome_produto">Nome do Produto: </label>
                    <input type="text" name="nome_produto" id="inome_produto" required>
                </div>

                <div>
                    <label for="ipreco">Preço por item: R$</label> 
                    <input type="number" name="preco" id="ipreco" min="0.01" step="0.01" required>
                </div>
                
                <div>
                    <label for="iquantidade">Quantidade: </label>
                    <input type="number" name="quantidade" id="iquantidade" min="1" step="1" required>
                </div>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </main>
</body>
</html>
