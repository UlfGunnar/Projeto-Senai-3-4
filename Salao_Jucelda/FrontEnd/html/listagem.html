<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Agendamentos | Sistema de Gestão do Salão</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Sistema de Gestão do Salão</h1>
		<nav aria-label="Navegação principal">
			<ul>
				<li><a href="home.html">Home</a></li>
				<li><a href="cadastro.html">Cadastro</a></li>
				<li><a href="listagem.html">Listagem de Agendamentos</a></li>
				<li><a href="agendamento.html">Criar Agendamento</a></li>
				<li><a href="../../dashboard_jucelda/dist/index_dash.html">Dashboard</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<h2>Listagem de agendamentos</h2>
		<table>
			<caption>Agendamentos cadastrados</caption>
			<thead>
				<tr>
					<th scope="col">Cliente</th>
					<th scope="col">Serviço</th>
					<th scope="col">Data</th>
					<th scope="col">Horário</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td colspan="4">Os agendamentos cadastrados serão exibidos aqui.</td>
				</tr>
			</tbody>
		</table>

		<section aria-labelledby="titulo-lembrete">
			<h3 id="titulo-lembrete">Informação ou lembrete</h3>
			<label for="lembrete">Escreva uma anotação:</label>
			<textarea id="lembrete" name="lembrete" rows="5" cols="50" placeholder="Digite seu lembrete aqui..."></textarea>
		</section>
	</main>
</body>
</html>
