<main>
	<h2>Criar agendamento</h2>
	<form>
		<div>
			<label for="nome-cliente">Nome do cliente</label>
			<input type="text" id="nome-cliente" name="nome-cliente" autocomplete="name">
		</div>
		<div>
			<label for="idade">Idade</label>
			<input type="number" id="idade" name="idade">
		</div>
		<div>
			<label for="telefone">Número de telefone</label>
			<input type="tel" id="telefone" name="telefone" autocomplete="tel">
		</div>
		<div>
			<label for="cep">CEP</label>
			<input type="text" id="cep" name="cep" autocomplete="postal-code">
		</div>
		<div>
			<label for="servico">Tipo de serviço</label>
			<select id="servico" name="servico">
				<option value="">Selecione um serviço</option>
				<option value="unhas">Unhas</option>
				<option value="cabelo">Cabelo</option>
			</select>
		</div>
		<div>
			<label for="data-agendamento">Data do agendamento</label>
			<input type="date" id="data-agendamento" name="data-agendamento">
		</div>
		<div>
			<label for="horario">Horário</label>
			<input type="time" id="horario" name="horario">
		</div>
		<div>
			<!-- Adicionando a opção de forma de pagamento -->
			<label for="forma-pagamento">Forma de pagamento</label>
			<select id="forma-pagamento" name="forma-pagamento">
				<option value="">Selecione uma forma de pagamento</option>
				<option value="credito">Crédito</option>
				<option value="debito">Débito</option>
				<option value="pix">Pix</option>
				<option value="dinheiro">Dinheiro</option>
				<option value="boleto">Boleto</option>
				<option value="gratis">Grátis</option>
				<option value="na">N/A</option>
			</select>
		</div>
		<button type="submit">Criar agendamento</button>
		<button type="reset">Limpar formulário</button>
		<a href="home.html">Cancelar</a>
	</form>
</main>
</body>
</html>
